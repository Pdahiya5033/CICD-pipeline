apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-cicd-demo
  namespace: secure-cicd
spec:
  podSelector:
    matchLabels:
      app: secure-cicd-demo
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - {}
